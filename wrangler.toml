name = "plausible-worker"
main = "src/worker.js"
compatibility_date = "2026-02-24"

# pkg.haus's own deployment. The same worker also runs in a separate account
# for other domains; Workers routes cannot reference a script in another
# account, so the zone's account needs its own copy.

# Plausible script URL per hostname.
[vars.PLAUSIBLE]
"pkg.haus" = "https://plausible.io/js/pa-kiBQqDx-awSRDKVVshfHr.js"
"apt.pkg.haus" = "https://plausible.io/js/pa-mEJlz3lTr_8EIQ-Wy0aO5.js"
"buildinfos.pkg.haus" = "https://plausible.io/js/pa-ZyiAC1M4BdYICTIP2cOFX.js"

[[routes]]
pattern = "*pkg.haus/zk/*"
zone_name = "pkg.haus"

# One pin per host that a sibling Worker claims host-wide. buildinfos.pkg.haus/*
# belongs to the buildinfos Worker and beat the wildcard above, so /zk/ there
# answered with that Worker's 404 page; a longer pattern on the same host wins
# it back.
#
# What decides it is pattern length, not host specificity: measured 2026-09-17,
# all three hosts serve 200 application/javascript on /zk/js/script.js, and
# pkg.haus/* at ten characters loses to *pkg.haus/zk/* at fifteen while
# buildinfos.pkg.haus/* at twenty-one wins. So the apex needs no pin and a
# longer host added later will.
#
# The apt pin is declared here because pkghaus/apt's own wrangler.toml states
# it holds: "apt.pkg.haus/zk/* (plausible-worker) ... pinned explicitly rather
# than left to *pkg.haus/zk/*". This file was the one place that did not say so.
[[routes]]
pattern = "apt.pkg.haus/zk/*"
zone_name = "pkg.haus"

[[routes]]
pattern = "buildinfos.pkg.haus/zk/*"
zone_name = "pkg.haus"

# Workers Logs. Every failure path here returns a response rather than
# throwing, so without this a proxy that stopped working and a quiet week are
# indistinguishable: the console.error calls had nowhere to go. Sampling stays
# at 1 -- the zone last measured around 5,000 requests/day against a 100k free
# limit, so there is nothing to thin out.
[observability]
enabled = true
head_sampling_rate = 1
