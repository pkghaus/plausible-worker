name: Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # No `|| npm install` fallback: a lockfile that does not match
      # package.json is a failure to fix, not to route around. The fallback
      # discards the lockfile's guarantee at exactly the moment it matters.
      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: actionlint
        # Pinned by digest; go-yaml inside it also rejects duplicate mapping
        # keys, which GitHub's parser rejects but many local checks accept.
        run: |
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      # `npx wrangler`, not `npx wrangler@4`: the second form reaches past the
      # lockfile and runs whatever 4.x npm serves that minute, holding a token
      # that can deploy this worker. Same reasoning that pins actions by
      # digest.
      - name: Deploy the worker
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PKGHAUS_PLAUSIBLE_WORKER_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
